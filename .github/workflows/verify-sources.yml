name: verify-sources

# Read-only source verification, run on demand.
#
# `doctor` fetches every enabled company's board and reports which ones can
# actually produce an alert; `discover` probes a name or careers URL and prints
# the companies.md row for whichever ATS it finds. Neither writes state and
# neither touches Discord, so this is safe to run against any branch.
#
# It exists because adapter configs (board tokens, tenant slugs, SmartRecruiters
# identifiers) can only be confirmed against the live endpoints — a unit test
# proves the parsing, not that the config points anywhere real.

on:
  # TEMPORARY: workflow_dispatch only accepts a ref once the workflow exists on
  # the default branch, so this trigger is here purely to verify the new
  # adapters against the live endpoints before merge. Remove it before merging.
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [doctor, discover]
        default: doctor
      targets:
        description: "discover only: space-separated company names or careers URLs"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Probe the new-platform adapters against live endpoints
        if: ${{ github.event_name == 'push' }}
        run: |
          python -m jobscraper discover \
            "Palo Alto Networks" Rippling Shopify "Hugging Face" Zoom Atlassian \
            Bolt Deel Remote Typeform || true

      - name: Health-check every enabled company
        if: ${{ github.event.inputs.mode == 'doctor' }}
        # doctor exits non-zero when any company is broken, which is information
        # rather than a failed job — the report above it is the point.
        run: python -m jobscraper doctor || true

      - name: Probe specific companies
        if: ${{ github.event.inputs.mode == 'discover' }}
        env:
          # Via the environment, never interpolated into the script body: a
          # dispatch input is attacker-controlled text as far as the shell is
          # concerned, and `${{ }}` inside run: pastes it in before bash parses.
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          if [ -z "$TARGETS" ]; then
            echo "No targets given. Pass names or careers URLs in the 'targets' input."
            exit 1
          fi
          # Deliberately unquoted: TARGETS is a space-separated list of targets.
          # shellcheck disable=SC2086
          python -m jobscraper discover $TARGETS
