name: internship-radar

on:
  schedule:
    # Every 5 minutes — GitHub's minimum, for the freshest catches. Note GitHub
    # does not guarantee on-time scheduled runs (they can be delayed/skipped under
    # load), so effective cadence is often ~5-12 min. Free + unlimited because the
    # repo is public.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Never let two runs overlap (they'd both touch seen_jobs.json).
concurrency:
  group: internship-radar
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated seen_jobs.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_TYPES: "intern,new_grad"
          OFF_SEASON_ONLY: "false"   # include summer internships too
          US_CANADA_ONLY: "true"   # only roles in the US or Canada
          # Freshness is dedup-based (alert on first detection), not board-date
          # based — board posted-dates are unreliable. See settings.py.
        run: python -m jobscraper run

      - name: Persist seen-jobs state
        run: |
          git config user.name "internship-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "No new state to commit."
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
