name: internship-radar

on:
  schedule:
    # Every 10 minutes. GitHub's minimum is 5 min (*/5), but scheduled runs are
    # frequently delayed 5-15 min under load and can occasionally be skipped, so
    # 10 min is the realistic sweet spot. Change to '*/5 * * * *' if you want.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Never let two runs overlap (they'd both touch seen_jobs.json).
concurrency:
  group: internship-radar
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the updated seen_jobs.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_TYPES: "intern,new_grad"
          OFF_SEASON_ONLY: "true"
          US_CANADA_ONLY: "true"   # only roles in the US or Canada
          MAX_AGE_DAYS: "3"        # only roles posted within the last 3 days (freshness guard)
        run: python -m jobscraper

      - name: Persist seen-jobs state
        run: |
          git config user.name "internship-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if git diff --cached --quiet; then
            echo "No new state to commit."
          else
            git commit -m "chore: update seen jobs [skip ci]"
            git push
          fi
